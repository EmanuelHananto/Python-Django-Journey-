{% extends "base.html" %}
{% load static %}

{% block css %}

    <link rel="stylesheet" href="{% static 'blog/includes/header.css' %}">
{% endblock %}
    {%block title%} All Blogs {%endblock%}

{%block content%}

        {%endfor%}
    </ul>
{% endblock %}
